[tools]
python = "3.14"
uv = "latest"


[settings]
python.uv_venv_auto = "create|source"


[tasks.agent]
description = "Run OpenCode monitor with a specified config profile"
usage = 'arg "<profile>" default="nvidia-glm" help="Profile key from config.json"'
run = "python -m agent {{ usage.profile }}"

[tasks.glm]
description = "Shortcut: Launch OpenCode with NVIDIA GLM-5.3 Flash"
run = "python -m agent nvidia-glm"

[tasks.stop-proxy]
description = "Stop the shared NVIDIA rate-limit proxy"
run = "python -m agent --stop-proxy"

[tasks.qwen]
description = "Shortcut: Launch OpenCode with Qwen-3-VL (default 32k)"
usage = '''
arg "<ctx>" default="32k" help="Context size" {
  choices "16k" "32k" "64k" "128k"
}
'''
run = "python -m agent qwen-3-vl-{{ usage.ctx }}"

[tasks.decompile]
description = "Generalized decompile: finds the first \game folder under src/renpy_game, copies relevant files into src/renpy_game/game, extracts .rpa archives, decompiles .rpyc files, and writes src/converter/config.json"
run = "python src/converter/decompile/decompile.py"

[tasks.compose]
description = "Compose composites + write manifest for a game (skip apply)"
usage = 'arg "<game>" help="Game directory name under src/renpy_game"'
run = 'python -m converter.pipeline --game {{ usage.game }} --compose-only'

[tasks.apply]
description = "Apply composites into live .rpy scripts for a game"
usage = 'arg "<game>" help="Game directory name under src/renpy_game"'
run = 'python -m converter.pipeline --game {{ usage.game }} --apply-only'

[tasks.pipeline]
description = "Full pipeline: decompile + compose for a game (skip apply)"
usage = 'arg "<game>" help="Game directory name under src/renpy_game"'
run = 'python -m converter.pipeline --game {{ usage.game }} --pipeline'

[tasks.restore-decompile]
description = "Undo decompile: remove generated .rpy and extracted archive dirs for a game"
usage = 'arg "<game>" help="Game directory name under src/renpy_game"'
run = 'python -m converter.pipeline --game {{ usage.game }} --restore-decompile'

[tasks.restore-compose]
description = "Undo compose/apply: restore .rpy files from archive.rpa for a game"
usage = 'arg "<game>" help="Game directory name under src/renpy_game"'
run = 'python -m converter.pipeline --game {{ usage.game }} --restore-compose'
