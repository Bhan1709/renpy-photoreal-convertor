[tools]
python = "3.14"
uv = "latest"


[settings]
python.uv_venv_auto = "create|source"

############## AGENT ##############

[tasks.agent]
description = "Launch OpenCode with a model profile (omit profile for interactive picker; or pass stop-proxy / list-profiles)"
run = "python -m agent"

############## CONVERTER ##############

[tasks.decompile]
description = "Decompile a Ren'Py game (interactive: clean, decompile, clean+decompile, or quit)"
run = "python -m converter.decompile"

[tasks.compose]
description = "Compose a Ren'Py game (interactive: exclusion check, clean, compose, clean+compose, review, apply)"
run = "python -m converter.compose"

[tasks.restore-compose]
description = "Undo compose/apply: restore .rpy files from archive.rpa"
run = "python -m converter.pipeline --restore-compose"
