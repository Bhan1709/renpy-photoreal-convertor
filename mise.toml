[tools]
python = "3.14"
uv = "latest"


[settings]
python.uv_venv_auto = "create|source"


[tasks.agent]
description = "Run OpenCode monitor with a specified config profile"
usage = 'arg "<profile>" default="nvidia-glm" help="Profile key from config.json"'
run = "python -m agent {{ usage.profile }}"

[tasks.nvidia]
description = "Shortcut: Launch OpenCode with NVIDIA Nemotron-3.5-Super-VL"
run = "python -m agent nvidia-nemotron-3.5-super-vl"

[tasks.stop-proxy]
description = "Stop the shared NVIDIA rate-limit proxy"
run = "python -m agent --stop-proxy"

[tasks.qwen]
description = "Shortcut: Launch OpenCode with Qwen-3-VL (default 32k)"
usage = '''
arg "<ctx>" default="32k" help="Context size" {
  choices "16k" "32k" "64k" "128k"
}
'''
run = "python -m agent qwen-3-vl-{{ usage.ctx }}"

[tasks.decompile]
description = 'Generalized decompile: finds the first \game folder under src/renpy_game, copies relevant files into src/renpy_game/game, extracts .rpa archives, decompiles .rpyc files, and writes src/converter/config.json'
run = "python src/converter/decompile/decompile.py"

[tasks.clean-decompile]
description = "Remove decompile artifacts: src/renpy_game/game folder and src/converter/config.json"
run = "python -c \"from converter.restore import restore_decompile; restore_decompile()\""

[tasks.decompile-clean]
description = "Clean decompile artifacts then regenerate them (clean + decompile)"
run = "mise run clean-decompile && mise run decompile"

[tasks.exclusions-sync]
description = "Remove exclusion-pattern-matched entries from rpy_files/ren_py_files in src/converter/config.json"
run = "python src/converter/decompile/sync_exclusions_cli.py"

[tasks.compose]
description = "Compose composites + write manifest for a game (skip apply). Uses src/converter/config.json (no --game needed)."
run = 'python -m converter.pipeline --compose-only'

[tasks.compose-clean]
description = "Removes older composites and composes new ones with manifests. Uses src/converter/config.json (no --game needed)."
run = 'python -m converter.pipeline --compose-only --clean-output'

[tasks.apply]
description = "Apply composites into live .rpy scripts for a game. Uses src/converter/config.json (no --game needed)."
run = 'python -m converter.pipeline --apply-only'

[tasks.pipeline]
description = "Default flow: decompile + prompt for exclusion patterns + compose (skip apply). Verify compose output before applying."
run = "python -m converter.pipeline"

[tasks.restore-compose]
description = "Undo compose/apply: restore .rpy files from archive.rpa for a game. Uses src/converter/config.json (no --game needed)."
run = 'python -m converter.pipeline --restore-compose'

[tasks.chars-list]
description = "List all character folder names (source of truth for character mapping)."
run = "python -m converter.compose.review chars-list"

[tasks.compose-review]
description = "Review scenes needing character association and unmapped speakers (blocks apply until resolved)."
run = "python -m converter.compose.review compose-review"

[tasks.review-interactive]
description = "Interactively review unmapped speakers and scenes missing character association, one at a time."
run = "python -m converter.compose.interactive_review"
