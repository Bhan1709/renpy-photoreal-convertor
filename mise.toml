[tools]
python = "3.14"
uv = "latest"


[settings]
python.uv_venv_auto = "create|source"

############## AGENT ##############

[tasks.agent]
description = "Launch OpenCode with a model profile (omit profile for interactive picker; or pass stop-proxy / list-profiles)"
run = "python -m agent"

############## CONVERTER ##############

[tasks.decompile]
description = "Decompile a Ren'Py game (interactive: clean, decompile, clean and decompile, or exit)"
run = "python -m converter.decompile"

[tasks.compose]
description = "Create and review photoreal composites (interactive: clean, compose, review, apply, or restore)"
run = "python -m converter.compose"
